<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tải file</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:#f5f7fb; margin:0; padding:30px 16px; color:#1f2937; }
  .wrap { max-width:720px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 6px; }
  .sub { color:#6b7280; font-size:14px; margin-bottom:24px; }
  .btn-all { width:100%; background:linear-gradient(135deg,#0f9d58,#0b8043);
             color:#fff; border:none; padding:18px; font-size:17px;
             font-weight:600; border-radius:12px; cursor:pointer;
             box-shadow:0 6px 20px rgba(15,157,88,.35);
             transition:transform .1s; }
  .btn-all:hover { transform:translateY(-1px); }
  .btn-all:disabled { opacity:.6; cursor:not-allowed; }
  .status { text-align:center; font-size:13px; color:#6b7280;
            margin:10px 0 26px; min-height:18px; }
  .item { display:flex; align-items:center; justify-content:space-between;
          gap:12px; background:#fff; border:1px solid #e5e7eb;
          border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .badge { padding:3px 8px; border-radius:6px; font-size:11px;
           font-weight:700; color:#fff; margin-right:8px; flex-shrink:0; }
  .apk { background:#10b981; }
  .zip { background:#f59e0b; }
  .name { font-size:14px; font-weight:500; }
  .btn-one { background:#1a73e8; color:#fff; padding:8px 16px;
             border:0; border-radius:8px; font-size:13px;
             font-weight:500; cursor:pointer; white-space:nowrap; }
  .btn-one:hover { background:#1557b0; }
  .btn-one:disabled { opacity:.6; cursor:not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Tải xuống 4 file</h1>
  <p class="sub">Gồm 1 file <b>.zip</b> và 3 file <b>.apk</b>.</p>

  <button class="btn-all" id="downloadAll">⬇ TẢI TẤT CẢ (1 ZIP + 3 APK)</button>
  <div class="status" id="status"></div>
  <div id="list"></div>
</div>

<script>
/* ============================================================
   URL APPS SCRIPT CỦA BẠN — đã điền sẵn
============================================================ */
const API = 'https://script.google.com/macros/s/AKfycbxZok7HjU3slkGWLSXnWhDe24OI9Vy_tYbJc0GhABS9NZwAs4cj9m5u217qXppiod2smQ/exec';

const FILES = [
  { id: '15KHcOylR_xZ3NSbZZ1LryU6F8ECBN_EU', name: 'File 1.apk', type: 'apk' },
  { id: '1wX5JlPFrloZo9MMPAdTaxXep0FIV0WIn', name: 'File 2.zip', type: 'zip' },
  { id: '1eRa-tCptamu49WReOrYVZnpoi_hMhLCr', name: 'File 3.apk', type: 'apk' },
  { id: '1xoAp2MG0hLQjIvCUmPvP3mcM-_8iT-6b', name: 'File 4.apk', type: 'apk' },
];

/* Lấy link tải cuối cùng qua Apps Script */
async function getUrl(id) {
  const r = await fetch(`${API}?id=${encodeURIComponent(id)}`);
  const d = await r.json();
  if (!d.ok) throw new Error(d.error || 'Apps Script lỗi');
  return d.url;
}

/* Kích hoạt tải xuống */
function triggerDownload(url, filename) {
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

/* Render danh sách */
document.getElementById('list').innerHTML = FILES.map((f, i) => `
  <div class="item">
    <div>
      <span class="badge ${f.type}">${f.type.toUpperCase()}</span>
      <span class="name">${i + 1}. ${f.name}</span>
    </div>
    <button class="btn-one" data-id="${f.id}" data-name="${f.name}">Tải</button>
  </div>
`).join('');

/* Nút tải từng file */
document.querySelectorAll('.btn-one').forEach(btn => {
  btn.addEventListener('click', async () => {
    const oldText = btn.textContent;
    btn.disabled = true;
    btn.textContent = '...';
    try {
      const url = await getUrl(btn.dataset.id);
      triggerDownload(url, btn.dataset.name);
    } catch (err) {
      alert('Lỗi: ' + err.message);
    }
    btn.textContent = oldText;
    btn.disabled = false;
  });
});

/* Nút tải tất cả */
document.getElementById('downloadAll').addEventListener('click', async () => {
  const btn = document.getElementById('downloadAll');
  const st = document.getElementById('status');
  btn.disabled = true;

  for (let i = 0; i < FILES.length; i++) {
    st.textContent = `Đang xử lý ${i + 1}/${FILES.length}: ${FILES[i].name}`;
    try {
      const url = await getUrl(FILES[i].id);
      triggerDownload(url, FILES[i].name);
    } catch (err) {
      console.error('Lỗi file', FILES[i].name, err);
      st.textContent = `⚠️ Lỗi file ${FILES[i].name}: ${err.message}`;
    }
    // Nghỉ giữa các file để trình duyệt không chặn
    await new Promise(r => setTimeout(r, 1200));
  }

  st.textContent = '✅ Đã gửi xong 4 file.';
  btn.disabled = false;
});
</script>
</body>
</html>
