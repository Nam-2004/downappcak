<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tải xuống 4 file</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f5f7fb; margin: 0; padding: 20px 14px 40px; color: #1f2937;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .sub { color: #6b7280; font-size: 13px; margin: 0 0 18px; }

  .btn-all {
    width: 100%;
    background: linear-gradient(135deg, #0f9d58, #0b8043);
    color: #fff; border: 0; padding: 16px;
    font-size: 16px; font-weight: 600;
    border-radius: 12px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(15,157,88,.35);
    transition: transform .1s, opacity .2s;
  }
  .btn-all:active { transform: scale(.98); }
  .btn-all:disabled { opacity: .6; cursor: not-allowed; }

  .status {
    text-align: center; font-size: 13px; color: #6b7280;
    margin: 10px 0 18px; min-height: 18px;
  }

  .item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; background: #fff;
    border: 1px solid #e5e7eb; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px;
  }
  .left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .badge {
    display: inline-block; padding: 3px 8px; border-radius: 6px;
    font-size: 10px; font-weight: 700; color: #fff;
    flex-shrink: 0; letter-spacing: .3px;
  }
  .apk { background: #10b981; }
  .zip { background: #f59e0b; }
  .name { font-size: 13px; font-weight: 500; word-break: break-word; }
  .btn-one {
    background: #1a73e8; color: #fff;
    border: 0; border-radius: 8px;
    padding: 8px 14px; font-size: 13px; font-weight: 500;
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .btn-one:active { background: #1557b0; }
  .btn-one:disabled { opacity: .6; cursor: not-allowed; }

  .error-box {
    background: #fef2f2; border: 1px solid #fecaca;
    color: #991b1b; padding: 12px 14px;
    border-radius: 10px; font-size: 12px;
    margin-top: 14px; display: none; word-break: break-all;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Tải xuống 4 file</h1>
  <p class="sub">Gồm 1 file <b>.zip</b> và 3 file <b>.apk</b>.</p>

  <button class="btn-all" id="downloadAll">⬇ TẢI TẤT CẢ (1 ZIP + 3 APK)</button>
  <div class="status" id="status"></div>

  <div id="list"></div>

  <div class="error-box" id="errBox"></div>
</div>

<script>
/* ============================================================
   ⚠️ THAY URL NÀY BẰNG URL APPS SCRIPT CỦA BẠN
============================================================ */
const API = 'https://script.google.com/macros/s/AKfycbxZok7HjU3slkGWLSXnWhDe24OI9Vy_tYbJc0GhABS9NZwAs4cj9m5u217qXppiod2smQ/exec';

/* Danh sách file — khớp với FILES trong Apps Script */
const FILES = [
  { id: '15KHcOylR_xZ3NSbZZ1LryU6F8ECBN_EU', name: 'File 1.apk', type: 'apk' },
  { id: '1wX5JlPFrloZo9MMPAdTaxXep0FIV0WIn', name: 'File 2.zip', type: 'zip' },
  { id: '1eRa-tCptamu49WReOrYVZnpoi_hMhLCr', name: 'File 3.apk', type: 'apk' },
  { id: '1xoAp2MG0hLQjIvCUmPvP3mcM-_8iT-6b', name: 'File 4.apk', type: 'apk' }
];

const listEl = document.getElementById('list');
const statusEl = document.getElementById('status');
const errBox = document.getElementById('errBox');

/* Hiện lỗi ra box đỏ thay vì alert */
function showError(msg) {
  errBox.style.display = 'block';
  errBox.textContent = '⚠️ ' + msg;
}
function clearError() {
  errBox.style.display = 'none';
  errBox.textContent = '';
}

/* Gọi Apps Script lấy link tải */
async function getUrl(id) {
  const res = await fetch(API + '?action=get&id=' + encodeURIComponent(id), {
    method: 'GET',
    redirect: 'follow'
  });

  if (!res.ok) throw new Error('HTTP ' + res.status);

  const data = await res.json();

  if (!data.ok) throw new Error(data.error || 'Apps Script trả lỗi');
  if (!data.url) throw new Error('Không có URL trả về');

  return data.url;
}

/* Kích hoạt tải */
function triggerDownload(url, filename) {
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.rel = 'noopener';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

/* Render danh sách */
listEl.innerHTML = FILES.map((f, i) => `
  <div class="item">
    <div class="left">
      <span class="badge ${f.type}">${f.type.toUpperCase()}</span>
      <span class="name">${i + 1}. ${f.name}</span>
    </div>
    <button class="btn-one" data-id="${f.id}" data-name="${f.name}">Tải</button>
  </div>
`).join('');

/* Tải từng file */
document.querySelectorAll('.btn-one').forEach(btn => {
  btn.addEventListener('click', async () => {
    clearError();
    const txt = btn.textContent;
    btn.disabled = true;
    btn.textContent = '...';
    try {
      const url = await getUrl(btn.dataset.id);
      triggerDownload(url, btn.dataset.name);
    } catch (err) {
      showError('File "' + btn.dataset.name + '": ' + err.message);
    }
    btn.textContent = txt;
    btn.disabled = false;
  });
});

/* Tải tất cả */
document.getElementById('downloadAll').addEventListener('click', async () => {
  clearError();
  const btn = document.getElementById('downloadAll');
  btn.disabled = true;
  let successCount = 0;

  for (let i = 0; i < FILES.length; i++) {
    statusEl.textContent = `Đang xử lý ${i + 1}/${FILES.length}: ${FILES[i].name}`;
    try {
      const url = await getUrl(FILES[i].id);
      triggerDownload(url, FILES[i].name);
      successCount++;
    } catch (err) {
      console.error('Lỗi', FILES[i].name, err);
      showError('File "' + FILES[i].name + '": ' + err.message);
    }
    // Nghỉ 1.2s để browser không chặn
    await new Promise(r => setTimeout(r, 1200));
  }

  if (successCount === FILES.length) {
    statusEl.textContent = '✅ Đã gửi xong 4 file. Kiểm tra Downloads.';
  } else {
    statusEl.textContent = `⚠️ Chỉ tải được ${successCount}/${FILES.length} file. Xem lỗi bên dưới.`;
  }
  btn.disabled = false;
});
</script>
</body>
</html>
